name: Deploy to EC2

on:
  push:
    branches: [deployment-prep]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::023360292621:role/github-deploy-role
  INSTANCE_ID: i-05a7ce82778de1bbc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package release
        run: |
          mkdir -p pkg
          cp -r .next/standalone/. pkg/
          mkdir -p pkg/.next
          cp -r .next/static pkg/.next/static
          if [ -d public ]; then cp -r public pkg/public; fi
          tar -czf release.tar.gz -C pkg .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o smp.deb
          sudo dpkg -i smp.deb

      - name: Configure SSH over SSM
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Host ec2" > ~/.ssh/config
          echo "  HostName ${{ env.INSTANCE_ID }}" >> ~/.ssh/config
          echo "  User ubuntu" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          echo "  ProxyCommand aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ${{ env.AWS_REGION }}" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copy release to server
        run: scp release.tar.gz ec2:/home/ubuntu/release.tar.gz

      - name: Deploy
        run: ssh ec2 "sudo SHA=${{ github.sha }} bash -s" < deploy/remote-deploy.sh